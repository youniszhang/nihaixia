services:
  api:
    build: ./server
    environment:
      # Secrets come from .env (never committed). The browser never sees these —
      # the API is only reachable through the Caddy reverse proxy.
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      # 管理员账号（用户名）。留空则沿用老规则（第一个注册的用户）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      # 注册开关初始值（后台可在线切换，切换后以数据库为准）
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-}
      DB_PATH: /app/data/nihaixia.db
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # 安全：容器化部署在 Caddy 反代之后，只信任紧邻的一跳代理。
      # （若设成 true 会信任整条转发链，攻击者伪造 X-Forwarded-For 即可绕过登录限流）
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # 安全：跨域默认关闭（同源即可正常使用）；确需跨域时在此列白名单
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # 日志里是否记录每个请求（默认关，避免把请求细节写进日志）
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # 「每日」类统计/限额按北京自然日（created_at 存储仍为 UTC 文本）
      TZ: ${TZ:-Asia/Shanghai}
      # 一键更新（可选）：指向 updater 容器
      UPDATER_URL: ${UPDATER_URL:-}
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - data:/app/data
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # 一键更新容器（可选，启用需在 .env 配置 UPDATER_TOKEN）
  # 不映射公网端口，仅 docker 内网可达；挂载 docker.sock 执行镜像重建。
  # 注意：不要设 container_name —— 固定容器名会在 up -d --build 重建时
  # 与旧容器争抢同名（Conflict / already in use），导致部署失败。
  # 容器间访问用 compose 服务名 DNS：http://updater:8765
  updater:
    profiles: ["updater"]
    build:
      context: ./server
      dockerfile: updater/Dockerfile
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:?set UPDATER_TOKEN to enable one-click update}
      # 挂载的是仓库根（含 .git），git 与 compose 操作都在此目录下执行
      PROJECT_DIR: /workspace
      GIT_BRANCH: ${GIT_BRANCH:-main}
      COMPOSE_FILE: app/docker-compose.yml
      SERVICE_NAME: "web api"
    volumes:
      # 必须挂仓库根而不是 app/：.git 在仓库根，只挂 app/ 会让容器内 git 全部失败
      - ..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    restart: unless-stopped
    expose:
      - "8765"

volumes:
  data:
  caddy_data:
  caddy_config:
